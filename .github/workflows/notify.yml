name: Aviso diario de Teams

on:
  schedule:
    # 13:00 UTC = 7:00 AM hora Ciudad Madero (UTC-6, sin horario de verano).
    # Ajusta este valor si quieres otra hora: minuto hora * * *
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-teams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restaurar sesion de Teams
        # La sesion viene partida en varios secrets (cada uno menor a
        # 48KB, el limite de GitHub). Los concatenamos y decodificamos.
        run: |
          printf '%s' \
            "${{ secrets.TEAMS_STATE_B64_0 }}" \
            "${{ secrets.TEAMS_STATE_B64_1 }}" \
            "${{ secrets.TEAMS_STATE_B64_2 }}" \
            "${{ secrets.TEAMS_STATE_B64_3 }}" \
            "${{ secrets.TEAMS_STATE_B64_4 }}" \
            "${{ secrets.TEAMS_STATE_B64_5 }}" \
            "${{ secrets.TEAMS_STATE_B64_6 }}" \
            "${{ secrets.TEAMS_STATE_B64_7 }}" \
            | base64 -d > state.json

      - name: Revisar Teams y notificar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_teams.py

      - name: Guardar snapshot de actividad
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_activity.json
          git diff --staged --quiet || git commit -m "Actualiza snapshot [skip ci]"
          git push
