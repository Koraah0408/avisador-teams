name: Responder preguntas por Telegram

# El cron se desactivo: ahora un Worker de Cloudflare (carpeta worker/)
# responde al instante via webhook de Telegram. Telegram no permite usar
# getUpdates (lo que hace este workflow) al mismo tiempo que un webhook
# esta activo. Se deja workflow_dispatch por si se quiere volver al
# modo de polling (borrando el webhook primero con setWebhook?url=).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Revisar y responder preguntas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/answer_bot.py

      - name: Guardar estado si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bot_state.json
          git diff --staged --quiet || git commit -m "Actualiza estado del bot [skip ci]"
          git push
